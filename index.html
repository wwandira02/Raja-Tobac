      <div class="pos-cart" id="pos-cart"></div>
      <div class="pos-note"><input id="pos-note-input" placeholder="Catatan transaksi (mis: hutang, ambil besok)..." oninput="posNote=this.value;"></div>
      <div class="pos-summary" id="pos-summary"></div>
    </div>
  </div>
  </div>`;
}
function togglePosFullscreen(){
  posFullscreen = !posFullscreen;
  document.getElementById('view-pos-wrap')?.parentElement && document.body.classList.toggle('pos-fs-active', posFullscreen);
  const wrap = document.querySelector('.content');
}
function initPOS(){
  // restore draft
  const draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
  if(draft && draft.branch===activeBranchId() && draft.cart && draft.cart.length){
    openModal(`<div class="modal-head"><h3>Lanjutkan Transaksi?</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body"><p>Ditemukan transaksi yang belum selesai (${draft.cart.length} item). Lanjutkan atau mulai baru?</p></div>
    <div class="modal-foot"><button class="btn" onclick="discardDraft()">Mulai Baru</button><button class="btn primary" onclick="restoreDraft()">Lanjutkan</button></div>`);
  }
  renderPosProducts(); renderPosFavStrip(); renderPosRightPanel();
  setTimeout(()=> document.getElementById('pos-search-input') && document.getElementById('pos-search-input').focus(), 50);
  document.onkeydown = posKeyHandler;
}
function discardDraft(){ localStorage.removeItem(DRAFT_KEY); closeModal(); }
function restoreDraft(){ const draft = JSON.parse(localStorage.getItem(DRAFT_KEY)); cart = draft.cart; posNote = draft.note||''; posCustomerType = draft.customerType||'umum'; posResellerId = draft.resellerId||''; closeModal(); renderPosProducts(); renderPosRightPanel(); }
function saveDraft(){ localStorage.setItem(DRAFT_KEY, JSON.stringify({ branch:activeBranchId(), cart, note:posNote, customerType:posCustomerType, resellerId:posResellerId })); }

function posKeyHandler(e){
  if(currentView!=='pos') { document.onkeydown=null; return; }
  if(e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA'){
    if(e.key==='Escape'){ e.target.value=''; if(e.target.id==='pos-search-input'){ posSearch=''; renderPosProducts(); } }
    if(e.key==='F2'){ e.preventDefault(); saveSale(); }
    if(e.key==='F3'){ e.preventDefault(); newTransaction(); }
    return;
  }
  if(e.key==='F1'){ e.preventDefault(); document.getElementById('pos-search-input').focus(); }
  if(e.key==='F2'){ e.preventDefault(); saveSale(); }
  if(e.key==='F3'){ e.preventDefault(); newTransaction(); }
  if(e.key==='F4'){ e.preventDefault(); document.querySelector('.pay-methods .btn')?.focus(); }
  if(e.key==='Delete' && selectedCartIdx!==null){ removeCartItem(selectedCartIdx); }
}
function renderPosFavStrip(){
  const branch = activeBranchId();
  const favs = DB.products.filter(p=>p.favorite && p.status==='active');
  document.getElementById('pos-fav-strip').innerHTML = favs.map(p=>`<div class="fav-card" onclick="quickAdd('${p.id}')">⭐<br>${escapeHtml(p.name)}<br><span class="muted">${fmtIDR(p.sellPrice)}</span></div>`).join('') || '';
}
function renderPosProducts(){
  const branch = activeBranchId();
  const grid = document.getElementById('pos-products'); if(!grid) return;
  const s = posSearch.toLowerCase();
  let list = DB.products.filter(p=>p.status==='active').filter(p=>{
    const matchS = !s || p.name.toLowerCase().includes(s) || p.brand.toLowerCase().includes(s) || p.category.toLowerCase().includes(s);
    const matchC = posCategory==='ALL' || p.category===posCategory;
    return matchS && matchC;
  });
  list.sort((a,b)=> (b.favorite - a.favorite) || a.name.localeCompare(b.name));
  if(!list.length){ grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="glyph">🔍</div>Produk tidak ditemukan</div>`; return; }
  grid.innerHTML = list.map(p=>{
    const stock = productStock(p, branch); const status = stockStatus(stock,p.minStock);
    const inCart = cart.find(c=>c.productId===p.id);
    return `<div class="prod-card" onclick="quickAdd('${p.id}')">
      ${inCart? `<div class="qty-badge">${inCart.qty}</div>`:''}
      <div class="pname">${escapeHtml(p.name)}</div>
      <div class="pbrand">${escapeHtml(p.brand)} · ${escapeHtml(p.unit)}</div>
      <div class="pprice">${fmtIDR(p.sellPrice)}</div>
      <div class="pstock ${status==='habis'?'muted':''}">
        ${status==='habis'? '<span class="badge danger">Habis</span>' : status==='menipis' ? `<span class="badge warn">Menipis · ${stock}</span>` : `<span class="muted">Stok: ${stock}</span>`}
      </div>
    </div>`;
  }).join('');
}
function quickAdd(pid){
  const branch = activeBranchId();
  const p = DB.products.find(x=>x.id===pid);
  const stock = productStock(p, branch);
  const existing = cart.find(c=>c.productId===pid);
  const curQty = existing? existing.qty : 0;
  if(curQty+1 > stock){ toast('Stok tidak mencukupi', 'error'); return; }
  if(existing){ existing.qty++; } else { cart.push({ productId:pid, qty:1, price:p.sellPrice, discount:0 }); }
  saveDraft(); renderPosProducts(); renderPosCart(); renderPosSummary();
}
function renderPosRightPanel(){
  document.getElementById('pos-cust-type').value = posCustomerType;
  const selEl = document.getElementById('pos-reseller-sel');
  const branch = activeBranchId();
  const resellersInBranch = DB.resellers.filter(r=>r.status==='active' && (r.branchId===branch));
  selEl.innerHTML = `<option value="">Pilih reseller...</option>` + resellersInBranch.map(r=>`<option value="${r.id}" ${posResellerId===r.id?'selected':''}>${escapeHtml(r.name)}</option>`).join('');
  selEl.classList.toggle('hidden', posCustomerType!=='reseller');
  document.getElementById('pos-note-input').value = posNote;
  renderPosCart(); renderPosSummary();
}
function renderPosCart(){
  const el = document.getElementById('pos-cart'); if(!el) return;
  if(!cart.length){ el.innerHTML = `<div class="empty-state"><div class="glyph">🛒</div>Keranjang kosong<br><span style="font-size:11.5px;">Klik produk atau tekan <span class="kbd">F1</span> untuk mencari</span></div>`; return; }
  el.innerHTML = cart.map((c,i)=>{
    const p = DB.products.find(x=>x.id===c.productId);
    const sub = c.qty*c.price - c.discount;
    return `<div class="cart-item ${selectedCartIdx===i?'selected':''}" onclick="selectedCartIdx=${i};">
      <div class="ci-info">
        <div class="ci-name">${escapeHtml(p?p.name:'—')}</div>
        <div class="ci-price">${fmtIDR(c.price)} ${c.discount?`· disk. ${fmtIDR(c.discount)}`:''} <span style="cursor:pointer; text-decoration:underline;" onclick="event.stopPropagation(); openItemDiscount(${i});">ubah</span></div>
      </div>
      <div class="qty-ctrl">
        <button onclick="event.stopPropagation(); changeQty(${i},-1);">−</button>
        <input value="${c.qty}" onclick="event.stopPropagation();" onchange="setQty(${i}, this.value)">
        <button onclick="event.stopPropagation(); changeQty(${i},1);">+</button>
      </div>
      <div class="ci-sub">${fmtIDR(sub)}</div>
      <div class="ci-del" onclick="event.stopPropagation(); removeCartItem(${i});">✕</div>
    </div>`;
  }).join('');
}
function changeQty(i, delta){
  const c = cart[i]; const p = DB.products.find(x=>x.id===c.productId); const stock = productStock(p, activeBranchId());
  const nq = c.qty+delta;
  if(nq<=0){ removeCartItem(i); return; }
  if(nq>stock){ toast('Stok tidak mencukupi','error'); return; }
  c.qty = nq; saveDraft(); renderPosCart(); renderPosSummary(); renderPosProducts();
}
function setQty(i, val){
  const q = Math.max(1, parseInt(val)||1); const c=cart[i]; const p=DB.products.find(x=>x.id===c.productId); const stock=productStock(p,activeBranchId());
  c.qty = Math.min(q, stock); saveDraft(); renderPosCart(); renderPosSummary(); renderPosProducts();
}
function removeCartItem(i){ cart.splice(i,1); selectedCartIdx=null; saveDraft(); renderPosCart(); renderPosSummary(); renderPosProducts(); }
function clearCart(){ if(!cart.length) return; confirmAction('Kosongkan Keranjang','Semua item pada keranjang akan dihapus.', ()=>{ cart=[]; saveDraft(); renderPosCart(); renderPosSummary(); renderPosProducts(); }); }
function openItemDiscount(i){
  const c = cart[i];
  openModal(`<div class="modal-head"><h3>Diskon Item</h3><button class="close-x" onclick="closeModal()">✕</button></div>
  <div class="modal-body"><div class="field"><label>Diskon (Rp)</label><input type="number" id="item-disc-input" value="${c.discount}"></div></div>
  <div class="modal-foot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="cart[${i}].discount=+document.getElementById('item-disc-input').value||0; saveDraft(); renderPosCart(); renderPosSummary(); closeModal();">Terapkan</button></div>`);
}
let posTxDiscount = 0;
function renderPosSummary(){
  const el = document.getElementById('pos-summary'); if(!el) return;
  const subtotal = cart.reduce((a,c)=>a+c.qty*c.price,0);
  const itemDisc = cart.reduce((a,c)=>a+c.discount,0);
  const totalDisc = itemDisc + posTxDiscount;
  const total = Math.max(0, subtotal - totalDisc);
  const change = Math.max(0, posCashReceived - total);
  el.innerHTML = `
    <div class="sum-line"><span>Total Item</span><b>${cart.length}</b></div>
    <div class="sum-line"><span>Total Qty</span><b>${cart.reduce((a,c)=>a+c.qty,0)}</b></div>
    <div class="sum-line"><span>Subtotal</span><b>${fmtIDR(subtotal)}</b></div>
    <div class="sum-line"><span>Diskon Transaksi <span style="cursor:pointer;text-decoration:underline;" onclick="openTxDiscount()">ubah</span></span><b>-${fmtIDR(totalDisc)}</b></div>
    <div class="sum-line total"><span>Total Bayar</span><b>${fmtIDR(total)}</b></div>
    <div class="pay-methods">
      ${['Tunai','QRIS','Transfer'].map(m=>`<button class="btn sm ${posPayment===m?'active':''}" onclick="posPayment='${m}'; renderPosSummary();">${m}</button>`).join('')}
    </div>
    ${posPayment==='Tunai' ? `
    <div class="field" style="margin-bottom:6px;"><label>Uang Diterima</label><input type="number" id="pos-cash-input" value="${posCashReceived||''}" oninput="posCashReceived=+this.value||0; renderPosSummary();"></div>
    <div class="cash-quick">
      <button class="btn sm" onclick="posCashReceived=${total}; renderPosSummary();">Pas</button>
      ${[50000,100000,200000,500000].map(v=>`<button class="btn sm" onclick="posCashReceived=${v}; renderPosSummary();">${(v/1000)}rb</button>`).join('')}
    </div>
    <div class="sum-line"><span>Kembalian</span><b>${fmtIDR(change)}</b></div>` : ''}
    <div class="pos-actions">
      <button class="btn" onclick="clearCart()">Kosongkan <span class="kbd">Del</span></button>
      <button class="btn primary" onclick="saveSale()">Simpan <span class="kbd">F2</span></button>
    </div>
  `;
}
function openTxDiscount(){
  openModal(`<div class="modal-head"><h3>Diskon Transaksi</h3><button class="close-x" onclick="closeModal()">✕</button></div>
  <div class="modal-body"><div class="field"><label>Diskon (Rp)</label><input type="number" id="tx-disc-input" value="${posTxDiscount}"></div></div>
  <div class="modal-foot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="posTxDiscount=+document.getElementById('tx-disc-input').value||0; renderPosSummary(); closeModal();">Terapkan</button></div>`);
}
function newTransaction(){
  if(cart.length){ confirmAction('Transaksi Baru','Keranjang saat ini akan dikosongkan tanpa disimpan. Lanjutkan?', doNewTransaction); }
  else doNewTransaction();
}
function doNewTransaction(){ cart=[]; posTxDiscount=0; posCashReceived=0; posNote=''; posCustomerType='umum'; posResellerId=''; localStorage.removeItem(DRAFT_KEY); renderPosProducts(); renderPosRightPanel(); }
function saveSale(){
  if(!cart.length){ toast('Keranjang masih kosong','error'); return; }
  const branch = activeBranchId();
  const subtotal = cart.reduce((a,c)=>a+c.qty*c.price,0);
  const itemDisc = cart.reduce((a,c)=>a+c.discount,0);
  const discountTotal = itemDisc+posTxDiscount;
  const total = Math.max(0, subtotal-discountTotal);
  if(posPayment==='Tunai' && posCashReceived < total){ toast('Uang diterima kurang dari total bayar','error'); return; }
  const user = currentUser();
  const sale = {
    id:uid('s'), date:todayISO(), branchId:branch, userId:user.id, items:cart.map(c=>({...c})),
    discountTotal, subtotal, total, paymentMethod:posPayment, cashReceived: posPayment==='Tunai'?posCashReceived:total,
    change: posPayment==='Tunai'? Math.max(0,posCashReceived-total):0, customerType:posCustomerType, resellerId: posCustomerType==='reseller'?posResellerId:null, note:posNote
  };
  cart.forEach(c=>{ const p = DB.products.find(x=>x.id===c.productId); p.stock[branch] = Math.max(0,(p.stock[branch]||0)-c.qty); logStock(c.productId, branch, 'sale', -c.qty, 'Penjualan POS', sale.id); });
  DB.sales.push(sale); saveDB(); localStorage.removeItem(DRAFT_KEY);
  toast('Transaksi tersimpan — '+fmtIDR(total), 'success');
  // low stock alert
  cart.forEach(c=>{
    const p = DB.products.find(x=>x.id===c.productId); const st = p.stock[branch];
    if(DB.settings.lowStockNotif){
      if(st<=0) toast(`Stok ${p.name} telah habis`, 'error');
      else if(st<=p.minStock) toast(`Stok ${p.name} tersisa ${st} ${p.unit}`, 'error');
    }
  });
  doNewTransaction();
}

  q = q.trim().toLowerCase();
  if(!q) return;
  // simple: if match found, could jump; keep unobtrusive (no dropdown to keep this lightweight)
}

/* ================================================================
   BOOT
================================================================ */
function enterApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').classList.add('active');
  applyTheme(); initSwatches(); updateBranchPill(); renderNav();
  const u = currentUser();
  document.getElementById('user-avatar').textContent = u.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('user-name-lbl').textContent = u.name;
  document.getElementById('user-role-lbl').textContent = u.role==='owner'?'Owner':'Staff Kasir';
  go('dashboard');
}
window.addEventListener('DOMContentLoaded', ()=>{
  loadDB(); loadSession();
  initSwatches();
  if(SESSION && DB.users.find(u=>u.id===SESSION.userId)){ enterApp(); }
  else { applyTheme(); document.getElementById('login-screen').style.display='flex'; }
  document.getElementById('login-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
});
</script>
